# Alembic 配置文件

[alembic]
# 脚本模板路径
script_location = alembic

# 模板路径前缀
prepend_sys_path = .

# 版本路径
version_path_separator = os

# sqlalchemy.url 从环境变量读取（在 env.py 中动态设置）
sqlalchemy.url = postgresql+asyncpg://trading:trading@localhost:15432/trading

# 时区
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
