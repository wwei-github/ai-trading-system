version: "3.9"

services:
  # 前端应用 (Nginx 静态资源 + API 反代)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "38000:80"
    depends_on:
      - backend

  # 后端 API (backend / celery 共用同一镜像，只构建一次)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "18000:8000"
    env_file:
      - backend/.env
    environment:
      # 显式覆盖为 docker 模式，使用容器网络内的服务名
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Worker (复用 backend 镜像，覆盖启动命令)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  # Celery Beat (复用 backend 镜像，覆盖启动命令)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
