version: "3.9"

services:
  # 前端应用 (Nginx 静态资源 + API 反代)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "38000:80"
    depends_on:
      - backend

  # 后端 API (backend / celery 共用同一镜像，只构建一次)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "18000:8000"
    env_file:
      - backend/.env
    environment:
      # 显式覆盖为 docker 模式，使用容器网络内的服务名
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      # 交易所 API 代理：通过 tinyproxy 容器转发
      EXCHANGE_PROXY: http://proxy:8888
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_started

  # Celery Worker (复用 backend 镜像，覆盖启动命令)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_PROXY: http://proxy:8888
    depends_on:
      - redis
      - postgres

  # Celery Beat (复用 backend 镜像，覆盖启动命令)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_PROXY: http://proxy:8888
    depends_on:
      - redis

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# 交易所 API 代理（tinyproxy）
  # 大陆用户访问 Binance 等境外交易所需配置此服务
  proxy:
    image: vimagick/tinyproxy:latest
    ports:
      - "18888:8888"
    volumes:
      - ./docker/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf
    environment:
      # 上游代理地址（可选，用户自有的 Shadowsocks/V2Ray/Clash 等）
      # Docker 中 127.0.0.1 指向容器自身，如需访问宿主机代理：
      #   macOS:   host.docker.internal:7890
      #   Linux:   宿主机实际 IP 或 172.17.0.1
      # 如果留空，tinyproxy 直连目标服务器（仅海外服务器可用）
      UPSTREAM_PROXY: ${PROXY_UPSTREAM:-}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
