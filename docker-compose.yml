version: "3.9"

services:
  # 前端应用 (Nginx 静态资源 + API 反代)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "38000:80"
    depends_on:
      - backend

  # 后端 API (backend / celery 共用同一镜像，只构建一次)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "18000:8000"
    env_file:
      - backend/.env
    environment:
      # 显式覆盖为 docker 模式，使用容器网络内的服务名
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      # 交易所 API 代理：通过 tinyproxy 容器转发
      EXCHANGE_PROXY: http://proxy:8888
      # Ollama 本地模型：通过容器内网访问
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      proxy:
        condition: service_started
      ollama:
        condition: service_started

  # Celery Worker (复用 backend 镜像，覆盖启动命令)
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_PROXY: http://proxy:8888
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - redis
      - postgres

  # Celery Beat (复用 backend 镜像，覆盖启动命令)
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.tasks beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      RUN_MODE: docker
      DATABASE_URL: postgresql+asyncpg://trading:trading@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      EXCHANGE_PROXY: http://proxy:8888
    depends_on:
      - redis

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# 交易所 API 代理（tinyproxy）
  # 大陆用户访问 Binance 等境外交易所需配置此服务
  proxy:
    image: vimagick/tinyproxy:latest
    ports:
      - "18888:8888"
    volumes:
      - ./docker/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf
    environment:
      # 上游代理地址（可选，用户自有的 Shadowsocks/V2Ray/Clash 等）
      # Docker 中 127.0.0.1 指向容器自身，如需访问宿主机代理：
      #   macOS:   host.docker.internal:7890
      #   Linux:   宿主机实际 IP 或 172.17.0.1
      # 如果留空，tinyproxy 直连目标服务器（仅海外服务器可用）
      UPSTREAM_PROXY: ${PROXY_UPSTREAM:-}
    restart: unless-stopped

  # Ollama 本地大模型服务
  # 用于 AI 助手的本地推理，无需外部 API Key
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Apple Silicon (M1/M2/M3) 使用 CPU 运行（Metal 加速暂不支持容器内）
    # NVIDIA GPU 用户可取消注释下方 deploy 配置
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Ollama 模型初始化容器（一次性任务）
  # 启动时自动拉取默认模型，完成后自动退出
  ollama-pull:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      echo '=== 启动 Ollama 服务端 ===' &&
      ollama serve &
      sleep 3 &&
      echo '=== 开始拉取默认模型 ===' &&
      until ollama list >/dev/null 2>&1; do sleep 1; done &&
      echo '服务端就绪，开始拉取...' &&
      ollama pull deepseek-r1:7b &&
      echo '✓ deepseek-r1:7b 拉取完成' &&
      ollama pull qwen3.5:9b &&
      echo '✓ qwen3.5:9b 拉取完成' &&
      ollama pull nomic-embed-text &&
      echo '✓ nomic-embed-text 拉取完成' &&
      echo '=== 所有模型拉取完成 ==='
      "
    depends_on:
      ollama:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  ollama_data:
