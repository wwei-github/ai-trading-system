# tinyproxy 配置文件
# 用于交易所 API 代理，在大陆等受限网络环境下访问境外交易所

User tinyproxy
Group tinyproxy

# 监听端口
Port 8888

# 允许所有容器内网 IP 访问
Allow 0.0.0.0/0

# 超时设置
Timeout 60
ConnectTimeout 30
ReadTimeout 60

# 连接数限制
MaxClients 100
MaxRequestsPerChild 0

# 日志级别（Info / Warning / Error / Critical）
LogLevel Info
Syslog On

# 隐藏代理标识
ViaProxyName "no"

# 禁用上游代理的 DNS 解析（交由上游代理处理）
# Upstream http gateway